# MAVLink Wrapper Devicetree Bindings

description: |
  MAVLink communication wrapper for Zephyr RTOS.

compatible: "mavlink-wrapper"

properties:
  label:
    type: string
    description: |
      Human-readable label for this MAVLink instance.
      Used in logs and shell commands.
      Example: "GCS", "Telemetry", "Companion"
  
  transport:
    type: phandle
    required: true
    description: |
      Reference to the transport interface used by this MAVLink instance.
      This should point to a UART or network device.

  serial-interface:
    type: boolean
    description: |
      Indicates if this MAVLink instance uses a serial interface (UART).
      Mutually exclusive with net-interface.

  net-interface:
    type: boolean
    description: |
      Indicates if this MAVLink instance uses network transport.
      If true, network configuration properties are required.
      Mutually exclusive with serial-interface.
    
  lora-interface:
    type: boolean
    description: |
      Indicates if this MAVLink instance uses lora transport.

  net-type:
    type: string
    required: false
    enum:
      - "udp"
    description: |
      Network transport protocol type.

  use-dhcp:
    type: boolean
    description: |
      If true, enables DHCP for this MAVLink network interface.
      If false, static IP configuration (local-ip) must be provided.
      Default: false

  local-ip:
    type: string
    description: |
      Local IP address (IPv4) for network transport.
      Required if use-dhcp is false.
      Example: "192.168.1.100"
      Default: "0.0.0.0"

  local-port:
    type: int
    default: 14550
    description: |
      Local port for network transport (bind port).
      For UDP: the port to listen on.
      Default: 14550

  remote-ip:
    type: string
    default: "0.0.0.0"
    description: |
      Remote IP address (IPv4) for network transport.
      For UDP: the destination IP for sent packets.
      Example: "192.168.1.1"
      Default: "0.0.0.0"

  remote-port:
    type: int
    default: 14551
    description: |
      Remote port for network transport.
      For UDP: the destination port for sent packets.
      Default: 14551

  lora-frequency:
    type: int
    description: |
      LoRa center frequency in Hz.
      Example: 868000000 (868 MHz), 915000000 (915 MHz)

  lora-bandwidth:
    type: int
    enum:
      - 125
      - 250
      - 500
    description: |
      LoRa signal bandwidth in kHz.
      Default: 125

  lora-spreading-factor:
    type: int
    description: |
      LoRa spreading factor (6..12).
      Higher SF = longer range, lower data rate, longer airtime.

  lora-coding-rate:
    type: int
    enum:
      - 5
      - 6
      - 7
      - 8
    description: |
      LoRa coding rate denominator: 5=4/5, 6=4/6, 7=4/7, 8=4/8.
      Default: 5 (4/5)

  lora-tx-power:
    type: int
    description: |
      LoRa TX power in dBm.
      Valid range depends on hardware (typically 2..20 dBm for SX1276).

  lora-preamble-length:
    type: int
    default: 8
    description: |
      LoRa preamble length in symbols.
      Default: 8
