name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: zephyr-mavlink
          submodules: recursive

      - name: Find Zephyr SDK
        run: |
          SDK_DIR=$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' -type d | sort -V | tail -1)
          echo "ZEPHYR_SDK_INSTALL_DIR=${SDK_DIR}" >> $GITHUB_ENV

      - name: West init
        run: |
          west init -l zephyr-mavlink
          west update --narrow -o=--depth=1
          pip install -r zephyr/scripts/requirements-base.txt

      - name: Build samples/basic (native_sim)
        working-directory: zephyr-mavlink
        run: |
          west build -p always -b native_sim samples/basic \
            -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        working-directory: zephyr-mavlink
        run: |
          python3 - <<'EOF'
          import json
          gcc_only = {'-fno-freestanding', '-fno-reorder-functions', '-fno-defer-pop',
                      '--param=min-pagesize=0'}
          with open('build/compile_commands.json') as f:
              db = json.load(f)
          for e in db:
              e['command'] = ' '.join(
                  p for p in e['command'].split() if p not in gcc_only)
          with open('build/compile_commands.json', 'w') as f:
              json.dump(db, f)
          EOF
          RCT=$(find /usr/bin /usr/local/bin -name 'run-clang-tidy*' 2>/dev/null | sort -V | tail -1)
          ${RCT} -p build/ \
            $(find src samples/basic/src -name '*.c' | tr '\n' ' ')

      - name: Build samples/basic (native_sim 64-bit)
        working-directory: zephyr-mavlink
        run: |
          west build -p always -b native_sim/native/64 samples/basic
